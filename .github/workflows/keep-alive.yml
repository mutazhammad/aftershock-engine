name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 8 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/events?select=id&limit=1" -H "apikey:  ${{ secrets.SUPABASE_KEY }}" -o /dev/null
